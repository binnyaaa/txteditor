<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>토막글 조판기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Batang&family=Noto+Serif+KR:wght@400&family=Hahmlet:wght@400&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* 왼쪽 설정 패널 + 오른쪽 페이지 미리보기. 조용한 작업 도구, 잉크색 하나만 강조 */
:root {
  --bg: #F2F2EF;
  --panel: #FFFFFF;
  --fg: #1D1D20;
  --muted: #62626A;
  --line: #DADAD5;
  --accent: #2E4A86;
  --accent-fg: #FFFFFF;
  --ui: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618; --panel: #202024; --fg: #ECECEF; --muted: #A2A2AA; --line: #34343A;
    --accent: #9FB6F2; --accent-fg: #14182A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161618; --panel: #202024; --fg: #ECECEF; --muted: #A2A2AA; --line: #34343A;
  --accent: #9FB6F2; --accent-fg: #14182A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 48px; padding-inline: 20px; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.2px; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
.layout { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
aside { flex: 1 1 340px; max-width: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 20px; }
.previews { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
legend { padding: 0; margin-bottom: 10px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.6px; }
label, .lab { font-size: 13px; }
textarea, input[type="text"], input[type="number"], select {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg);
  font: inherit; font-size: 14px; padding: 9px 10px; min-height: 40px;
}
textarea { height: clamp(380px, 62vh, 640px); min-height: 200px; resize: vertical; line-height: 1.7; font-family: "Nanum Myeongjo", serif; }
.row { display: flex; flex-direction: column; gap: 6px; }
.row .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.row .val { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; height: 24px; }
.check { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; min-height: 40px; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.colors { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.colors label { display: flex; align-items: center; gap: 8px; }
input[type="color"] { width: 40px; height: 32px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: var(--bg); cursor: pointer; }
.btn { min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn:hover { filter: brightness(0.97); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.bar .sum { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.hint { font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 20px; }
.page { display: flex; flex-direction: column; gap: 8px; }
.page canvas { width: 100%; height: auto; max-width: 100%; display: block; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,0.06); background: #fff; }
.page .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.page .meta .btn { min-height: 34px; padding: 0 12px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }
</style>

<div class="wrap">
  <header>
    <h1>토막글 조판기</h1>
    <p>글을 붙여넣으면 장마다 가운데로 맞춰 나눠줍니다. 설정은 이 브라우저에 저장돼요.</p>
  </header>

  <div class="layout">
    <aside aria-label="설정">
      <fieldset>
        <legend>본문</legend>
        <textarea id="text" aria-label="본문" spellcheck="false"></textarea>
        <div class="row">
          <div class="top"><label for="maxChars">한 장 최대 글자 수</label><span class="val">0이면 제한 없음</span></div>
          <input id="maxChars" type="number" min="0" step="50" data-key="maxChars">
        </div>
      </fieldset>

      <fieldset>
        <legend>판형 · 글꼴</legend>
        <div class="grid2">
          <div class="row"><label for="ratio">비율</label>
            <select id="ratio" data-key="ratio">
              <option value="1080x1350">4:5 (1080×1350)</option>
              <option value="1080x1080">1:1 (1080×1080)</option>
              <option value="1080x1440">3:4 (1080×1440)</option>
              <option value="1080x1920">9:16 (1080×1920)</option>
            </select>
          </div>
          <div class="row"><label for="font">글꼴</label>
            <select id="font">
              <optgroup label="웹 글꼴">
                <option value="Nanum Myeongjo">나눔명조</option>
                <option value="Gowun Batang">고운바탕</option>
                <option value="Noto Serif KR">본명조</option>
                <option value="Hahmlet">함렛</option>
                <option value="Gowun Dodum">고운돋움</option>
                <option value="Noto Sans KR">본고딕</option>
              </optgroup>
              <optgroup label="올린 글꼴" id="uploadedGroup" hidden></optgroup>
              <option value="__local">내 컴퓨터 글꼴…</option>
            </select>
          </div>
        </div>
        <div class="row" id="localRow" hidden>
          <label for="localFont">설치된 글꼴 이름</label>
          <input id="localFont" type="text" list="localList" placeholder="예: 맑은 고딕, KoPub바탕체 Light" autocomplete="off">
          <datalist id="localList"></datalist>
          <div class="top">
            <span class="val" id="localStatus">글꼴 이름을 정확히 입력하세요</span>
            <button type="button" class="btn" id="queryFonts" hidden>목록 불러오기</button>
          </div>
        </div>
        <div class="row">
          <button type="button" class="btn" id="uploadBtn">글꼴 파일 올리기 (.ttf .otf .woff .woff2)</button>
          <input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2" hidden>
        </div>
        <div class="row"><span class="lab">정렬</span>
          <div class="seg" role="group" aria-label="정렬" id="align">
            <button type="button" data-align="justify">양쪽</button>
            <button type="button" data-align="left">왼쪽</button>
            <button type="button" data-align="center">가운데</button>
          </div>
        </div>
        <label class="check" for="indent">문단 첫 줄 들여쓰기<input id="indent" type="checkbox" data-key="indent"></label>
      </fieldset>

      <fieldset>
        <legend>글자</legend>
        <div class="row"><div class="top"><label for="size">글자 크기</label><span class="val" data-out="size"></span></div>
          <input id="size" type="range" min="14" max="44" step="0.5" data-key="size"></div>
        <div class="row"><div class="top"><label for="tracking">자간</label><span class="val" data-out="tracking"></span></div>
          <input id="tracking" type="range" min="-0.12" max="0.3" step="0.01" data-key="tracking"></div>
        <div class="row"><div class="top"><label for="leading">줄 간격</label><span class="val" data-out="leading"></span></div>
          <input id="leading" type="range" min="1.1" max="2.8" step="0.05" data-key="leading"></div>
        <div class="row"><div class="top"><label for="paraGap">문단 간격</label><span class="val" data-out="paraGap"></span></div>
          <input id="paraGap" type="range" min="0" max="2.5" step="0.1" data-key="paraGap"></div>
      </fieldset>

      <fieldset>
        <legend>여백</legend>
        <div class="row"><div class="top"><label for="side">좌우 여백</label><span class="val" data-out="side"></span></div>
          <input id="side" type="range" min="30" max="360" step="2" data-key="side"></div>
        <div class="row"><div class="top"><label for="vert">위아래 여백</label><span class="val" data-out="vert"></span></div>
          <input id="vert" type="range" min="30" max="460" step="2" data-key="vert"></div>
      </fieldset>

      <fieldset>
        <legend>아래쪽 표시</legend>
        <label class="check" for="showPage">페이지 수<input id="showPage" type="checkbox" data-key="showPage"></label>
        <label class="check" for="showCredit">크레딧<input id="showCredit" type="checkbox" data-key="showCredit"></label>
        <input id="credit" type="text" aria-label="크레딧 문구" data-key="credit">
      </fieldset>

      <fieldset>
        <legend>색</legend>
        <div class="colors">
          <label for="bgColor"><input id="bgColor" type="color" data-key="bgColor">배경</label>
          <label for="fgColor"><input id="fgColor" type="color" data-key="fgColor">글자</label>
          <button type="button" class="btn" id="reset">설정 초기화</button>
        </div>
      </fieldset>
    </aside>

    <section class="previews" aria-label="미리보기">
      <div class="bar">
        <span class="sum" id="sum">조판 중…</span>
        <button type="button" class="btn primary" id="saveAll">전체 저장 (zip)</button>
      </div>
      <p class="hint" id="hint" hidden></p>
      <div class="pages" id="pages"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const SAMPLE = [
  '창밖으로 눈이 내리고 있었다. 그는 대답 대신 찻잔을 내려놓았다. 김이 천천히 흩어졌다.',
  '“늦었네요.”',
  '“조금.”',
  '그 조금이 몇 해였는지, 둘 다 묻지 않았다. 묻는 순간 그 시간에 이름이 붙을 것 같았고, 이름이 붙은 것들은 대개 끝을 향해 걸어갔다. 그녀는 그걸 알고 있었다. 그도 아마 알고 있었을 것이다.',
  '난로 위에서 물이 다시 끓기 시작했다. 그녀는 일어나 불을 줄였다. 등을 보인 채로, 아주 작게 말했다.',
  '“그래도 왔네요.”',
  '그는 그 말에 대답할 문장을 오래 골랐다. 미안하다는 말은 너무 가벼웠고, 보고 싶었다는 말은 너무 무거웠다. 그 사이에 놓일 만한 말은 이 세상에 없는 것 같았다. 그래서 그는 끝내 아무것도 고르지 않았다. 대신 식어가는 찻잔을 두 손으로 감쌌다. 손끝이 조금씩 따뜻해졌다.',
  '창문 아래로 누군가 지나가는 발소리가 들렸다. 눈을 밟는 소리는 생각보다 크고, 생각보다 금방 사라졌다. 그녀는 그 소리가 완전히 멎을 때까지 창밖을 보았다. 유리에 비친 그의 얼굴이 흐릿하게 겹쳐 있었다. 예전보다 조금 마른 것 같았다. 아니면 그녀가 기억하는 얼굴이 처음부터 조금 더 둥글었던 건지도 몰랐다.',
  '“방은 그대로예요.”',
  '“…….”',
  '“치우지 못한 게 아니라, 안 치운 거예요.”',
  '그녀는 그렇게 덧붙이고 나서야 자신이 무슨 말을 했는지 깨달았다. 변명처럼 들렸을까. 고백처럼 들렸을까. 어느 쪽이든 이제 와서 되돌릴 수는 없었다. 그는 고개를 들었다가, 다시 숙였다.',
  '바깥의 바람이 창틀을 한 번 흔들고 지나갔다. 그녀는 찻주전자를 들어 그의 잔에 차를 조금 더 따랐다. 이미 식은 차 위로 뜨거운 차가 섞이며 미지근한 온도가 되었다. 지금 두 사람 사이의 거리도 꼭 그만큼일 거라고, 그녀는 생각했다. 너무 차갑지도 너무 뜨겁지도 않은, 그래서 오히려 어떻게 마셔야 할지 모르는 온도.',
  '“내일은 길이 막힐 거예요.”',
  '“알아요.”',
  '“그럼 하루 더 있다 가요.”',
  '그는 대답하지 않았다. 다만 찻잔을 내려놓지도 않았다. 그녀는 그것으로 충분하다고 여겼다. 오래 기다린 사람에게는 작은 머뭇거림도 대답이 되는 법이었다.',
  '시계가 열한 시를 알렸다. 둘 중 누구도 먼저 일어나지 않았다.',
  '“고마워요.”',
  '그것이 그가 그날 밤 처음으로 고른 말이었다. 그녀는 대답하지 않았다. 대답하지 않는 것으로 대답을 대신하는 일에, 둘은 너무 오래 익숙해져 있었다.',
  '눈은 그날 밤 내내 그치지 않았다.'
].join('\n');

const DEFAULTS = {
  text: SAMPLE, maxChars: 1000, ratio: '1080x1350', font: 'Nanum Myeongjo', fontSource: 'web', lastLocal: '', align: 'justify', indent: true,
  size: 19, tracking: 0, leading: 1.6, paraGap: 0, side: 140, vert: 100,
  showPage: true, showCredit: true, credit: '@idsmsnulsae_c', bgColor: '#ffffff', fgColor: '#222222'
};
const STORE = 'tomak-settings-v1';
let S = { ...DEFAULTS };
try { const saved = JSON.parse(localStorage.getItem(STORE) || 'null'); if (saved) S = { ...DEFAULTS, ...saved }; } catch (e) {}
if (S.fontSource === 'file') { S.font = DEFAULTS.font; S.fontSource = 'web'; } // 올린 파일은 새로 열면 다시 올려야 함

const $ = (id) => document.getElementById(id);
const fmt = {
  size: (v) => v + 'px', tracking: (v) => (v > 0 ? '+' : '') + Number(v).toFixed(2) + 'em',
  leading: (v) => Number(v).toFixed(2) + '배', paraGap: (v) => Number(v).toFixed(1) + '줄',
  side: (v) => v + 'px', vert: (v) => v + 'px'
};

// ── 컨트롤 연결
function syncControls() {
  $('text').value = S.text;
  document.querySelectorAll('[data-key]').forEach((el) => {
    const k = el.dataset.key;
    if (el.type === 'checkbox') el.checked = !!S[k]; else el.value = S[k];
  });
  document.querySelectorAll('[data-out]').forEach((el) => { el.textContent = fmt[el.dataset.out](S[el.dataset.out]); });
  document.querySelectorAll('#align button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.align === S.align)));
  $('credit').disabled = !S.showCredit;
  syncFont();
}

// ── 글꼴: 웹 글꼴 / 올린 파일 / 내 컴퓨터에 설치된 글꼴
const WEB_FONTS = ['Nanum Myeongjo', 'Gowun Batang', 'Noto Serif KR', 'Hahmlet', 'Gowun Dodum', 'Noto Sans KR'];
const uploaded = new Set();
function syncFont() {
  const sel = $('font');
  if (S.fontSource === 'local') { sel.value = '__local'; $('localRow').hidden = false; $('localFont').value = S.font; checkLocal(); }
  else { sel.value = S.font; $('localRow').hidden = true; }
}
function fontExists(name) {
  const c = document.createElement('canvas').getContext('2d');
  const probe = '가나다라마바사 abcdefg 0123';
  return ['monospace', 'serif', 'sans-serif'].some((fb) => {
    c.font = '40px ' + fb; const a = c.measureText(probe).width;
    c.font = '40px "' + name + '", ' + fb; return c.measureText(probe).width !== a;
  });
}
function checkLocal() {
  const name = S.font.trim();
  $('localStatus').textContent = !name ? '글꼴 이름을 정확히 입력하세요'
    : fontExists(name) ? '찾았어요' : '이 이름의 글꼴을 찾지 못했어요 (기본 글꼴로 보임)';
}
$('font').addEventListener('change', () => {
  const v = $('font').value;
  if (v === '__local') { S.fontSource = 'local'; S.font = $('localFont').value.trim() || S.lastLocal || ''; }
  else { S.fontSource = uploaded.has(v) ? 'file' : 'web'; S.font = v; }
  syncFont(); changed();
});
$('localFont').addEventListener('input', () => {
  S.font = $('localFont').value.trim(); S.lastLocal = S.font; checkLocal(); changed();
});
if ('queryLocalFonts' in window) {
  $('queryFonts').hidden = false;
  $('queryFonts').addEventListener('click', async () => {
    try {
      const list = await window.queryLocalFonts();
      const fams = [...new Set(list.map((f) => f.family))].sort((a, b) => a.localeCompare(b, 'ko'));
      $('localList').replaceChildren(...fams.map((f) => { const o = document.createElement('option'); o.value = f; return o; }));
      $('localStatus').textContent = fams.length + '개 글꼴을 불러왔어요. 이름 칸을 눌러 고르세요';
    } catch (e) {
      $('localStatus').textContent = '목록을 불러올 수 없는 환경이에요. 이름을 직접 입력하세요';
      $('queryFonts').hidden = true;
    }
  });
}
$('uploadBtn').addEventListener('click', () => $('fontFile').click());
$('fontFile').addEventListener('change', async () => {
  const file = $('fontFile').files[0]; if (!file) return;
  const name = file.name.replace(/\.(ttf|otf|woff2?)$/i, '');
  try {
    const face = new FontFace(name, await file.arrayBuffer());
    await face.load(); document.fonts.add(face);
    if (!uploaded.has(name)) {
      uploaded.add(name);
      const o = document.createElement('option'); o.value = name; o.textContent = name;
      $('uploadedGroup').append(o); $('uploadedGroup').hidden = false;
    }
    S.font = name; S.fontSource = 'file'; syncFont(); changed();
    toast('글꼴을 올렸어요: ' + name);
  } catch (e) { toast('글꼴 파일을 읽지 못했어요'); }
  $('fontFile').value = '';
});
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }

$('text').addEventListener('input', (e) => { S.text = e.target.value; changed(); });
document.querySelectorAll('[data-key]').forEach((el) => {
  el.addEventListener('input', () => {
    const k = el.dataset.key;
    if (el.type === 'checkbox') S[k] = el.checked;
    else if (el.type === 'range' || el.type === 'number') S[k] = Number(el.value) || 0;
    else S[k] = el.value;
    const out = document.querySelector('[data-out="' + k + '"]');
    if (out) out.textContent = fmt[k](S[k]);
    $('credit').disabled = !S.showCredit;
    changed();
  });
});
document.querySelectorAll('#align button').forEach((b) => b.addEventListener('click', () => {
  S.align = b.dataset.align; syncControls(); changed();
}));
$('reset').addEventListener('click', () => { const t = S.text; S = { ...DEFAULTS, text: t }; syncControls(); changed(); });

let timer = null;
function changed() { save(); clearTimeout(timer); timer = setTimeout(render, 120); }

// ── 조판
function makeMeasure(ctx) {
  const cache = new Map();
  return (ch) => { let w = cache.get(ch); if (w === undefined) { w = ctx.measureText(ch).width; cache.set(ch, w); } return w; };
}

function wrapPara(chars, maxW, firstIndent, m, sp) {
  const tokens = []; let cur = [];
  for (const c of chars) { cur.push(c); if (c === ' ') { tokens.push(cur); cur = []; } }
  if (cur.length) tokens.push(cur);
  const width = (arr) => { let s = 0; for (const c of arr) s += m(c) + sp; return arr.length ? s - sp : 0; };

  const lines = []; let line = []; let indent = firstIndent;
  const lineW = () => width(line);
  const flush = () => { while (line.length && line[line.length - 1] === ' ') line.pop(); lines.push({ chars: line, indent }); indent = 0; line = []; };

  for (const tok of tokens) {
    const core = tok[tok.length - 1] === ' ' ? tok.slice(0, -1) : tok;
    const joined = line.length ? lineW() + sp + width(core) : width(core);
    if (joined <= maxW - indent) { line.push(...tok); continue; }
    if (line.length) flush();
    if (width(core) <= maxW - indent) { line.push(...tok); continue; }
    for (const c of tok) {
      if (!line.length && c === ' ') continue;
      const next = line.length ? lineW() + sp + m(c) : m(c);
      if (next > maxW - indent && line.length) flush();
      if (!(line.length === 0 && c === ' ')) line.push(c);
    }
  }
  if (line.length || !lines.length) flush();
  lines[lines.length - 1].last = true;
  return lines;
}

function layout() {
  const [W, H] = S.ratio.split('x').map(Number);
  const c = document.createElement('canvas').getContext('2d');
  const font = S.size + 'px "' + S.font + '", serif';
  c.font = font;
  const m = makeMeasure(c);
  const sp = S.tracking * S.size;
  const side = Math.min(S.side, W / 2 - 40);
  const vert = Math.min(S.vert, H / 2 - 40);
  const textW = W - side * 2;
  const availH = H - vert * 2;
  const lineH = S.size * S.leading;
  const gap = S.size * S.leading * S.paraGap;
  const indentPx = S.indent && S.align !== 'center' ? S.size : 0;

  const items = [];
  S.text.replace(/\r/g, '').replace(/\t/g, ' ').split('\n').forEach((p) => {
    if (!p.trim()) { items.push({ chars: [], blank: true, paraStart: true, last: true }); return; }
    wrapPara(Array.from(p.trim()), textW, indentPx, m, sp).forEach((l, j) => { l.paraStart = j === 0; items.push(l); });
  });

  const pages = []; let page = { lines: [], h: 0, count: 0 };
  for (const it of items) {
    const cnt = it.chars.filter((ch) => ch !== ' ').length;
    const g = it.paraStart && page.lines.length ? gap : 0;
    const overH = page.h + g + lineH > availH + 0.5;
    const overC = S.maxChars > 0 && page.count + cnt > S.maxChars;
    if (page.lines.length && (overH || overC)) { page.reason = overH ? 'height' : 'chars'; pages.push(page); page = { lines: [], h: 0, count: 0 }; }
    if (!page.lines.length && it.blank) continue;
    const g2 = it.paraStart && page.lines.length ? gap : 0;
    const line = { ...it, y: page.h + g2 };
    page.h += g2 + lineH; page.count += cnt; page.lines.push(line);
  }
  if (page.lines.length) pages.push(page);
  pages.forEach((pg) => {
    while (pg.lines.length && pg.lines[pg.lines.length - 1].blank) pg.lines.pop();
    const last = pg.lines[pg.lines.length - 1];
    pg.h = last ? last.y + lineH : 0;
  });
  if (!pages.length) pages.push({ lines: [], h: 0, count: 0 });
  return { W, H, font, m, sp, side, vert, textW, availH, lineH, pages };
}

function drawPage(canvas, L, idx) {
  const { W, H, font, sp, side, vert, textW, availH, lineH } = L;
  const page = L.pages[idx];
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = S.bgColor; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = S.fgColor; ctx.font = font; ctx.textBaseline = 'middle';
  const m = makeMeasure(ctx);
  const y0 = vert + (availH - page.h) / 2;
  for (const l of page.lines) {
    const n = l.chars.length; if (!n) continue;
    const ws = l.chars.map(m);
    let natural = sp * (n - 1); for (const w of ws) natural += w;
    const indent = l.indent || 0;
    let x = side + indent, extra = 0;
    if (S.align === 'center') x = side + (textW - natural) / 2;
    else if (S.align === 'justify' && !l.last && n > 1) {
      const e = (textW - indent - natural) / (n - 1);
      if (e > 0 && e < S.size * 0.6) extra = e;
    }
    const yc = y0 + l.y + lineH / 2;
    for (let i = 0; i < n; i++) { if (l.chars[i] !== ' ') ctx.fillText(l.chars[i], x, yc); x += ws[i] + sp + extra; }
  }
  const fs = Math.max(14, Math.round(S.size * 0.62));
  const fy = H - Math.max(vert / 2, fs * 1.6);
  ctx.font = fs + 'px "' + S.font + '", serif';
  ctx.globalAlpha = 0.55;
  if (S.showPage) { ctx.textAlign = 'left'; ctx.fillText((idx + 1) + ' / ' + L.pages.length, side, fy); }
  if (S.showCredit && S.credit.trim()) { ctx.textAlign = S.showPage ? 'right' : 'right'; ctx.fillText(S.credit.trim(), W - side, fy); }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

let L = null, gen = 0;
async function render() {
  const my = ++gen;
  const sampleText = S.text + S.credit + '0123456789 /';
  try { await document.fonts.load(S.size + 'px "' + S.font + '"', sampleText.slice(0, 30000)); } catch (e) {}
  if (my !== gen) return;
  L = layout();
  const box = $('pages');
  while (box.children.length > L.pages.length) box.lastChild.remove();
  L.pages.forEach((pg, i) => {
    let card = box.children[i];
    if (!card) {
      card = document.createElement('div'); card.className = 'page';
      const cv = document.createElement('canvas');
      const meta = document.createElement('div'); meta.className = 'meta';
      const info = document.createElement('span');
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn'; btn.textContent = 'PNG 저장';
      btn.addEventListener('click', () => savePage(Number(card.dataset.i)));
      meta.append(info, btn); card.append(cv, meta); box.append(card);
    }
    card.dataset.i = i;
    const cv = card.querySelector('canvas');
    cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', (i + 1) + '번째 장 미리보기');
    drawPage(cv, L, i);
    card.querySelector('.meta span').textContent = (i + 1) + ' / ' + L.pages.length + ' · ' + pg.count.toLocaleString('ko-KR') + '자';
  });
  const total = L.pages.reduce((s, p) => s + p.count, 0);
  $('sum').textContent = L.pages.length + '장 · 총 ' + total.toLocaleString('ko-KR') + '자 · ' + L.W + '×' + L.H;
  const short = S.maxChars > 0 && L.pages.some((p) => p.reason === 'height' && p.count < S.maxChars * 0.9);
  const hint = $('hint');
  hint.hidden = !short;
  if (short) hint.textContent = '글자 크기나 여백 때문에 한 장에 ' + S.maxChars.toLocaleString('ko-KR') + '자가 다 들어가지 않는 장이 있어요. 글자를 줄이거나 여백·줄 간격을 줄이면 더 들어갑니다.';
}

// ── 저장
let dl = null;
const dlReady = (async () => { try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) {} })();
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2400); }
const toBlob = (cv) => new Promise((res) => cv.toBlob(res, 'image/png'));
function baseName() { const first = (S.text.trim().split('\n')[0] || '토막글').replace(/[\\/:*?"<>|“”.,…]/g, '').trim().slice(0, 12); return first || '토막글'; }

async function saveBlob(name, blob) {
  await dlReady;
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast('저장했어요'); }
    catch (e) { if (e && e.code === 'declined') return; toast('저장하지 못했어요 (' + ((e && e.code) || '오류') + ')'); }
    return;
  }
  if (window.claude) { toast('이 화면에서는 파일 저장을 쓸 수 없어요'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function savePage(i) {
  const cv = $('pages').children[i].querySelector('canvas');
  await saveBlob(baseName() + '_' + String(i + 1).padStart(2, '0') + '.png', await toBlob(cv));
}
$('saveAll').addEventListener('click', async () => {
  const cvs = [...$('pages').querySelectorAll('canvas')];
  if (cvs.length === 1) return savePage(0);
  if (!window.JSZip) { toast('압축 도구를 불러오지 못했어요. 장마다 저장해 주세요'); return; }
  const zip = new JSZip();
  for (let i = 0; i < cvs.length; i++) zip.file(baseName() + '_' + String(i + 1).padStart(2, '0') + '.png', await toBlob(cvs[i]));
  await saveBlob(baseName() + '.zip', await zip.generateAsync({ type: 'blob' }));
});

syncControls();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
})();
</script>

</body>
</html>
